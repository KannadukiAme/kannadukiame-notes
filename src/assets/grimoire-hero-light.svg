    <linearGradient id="cardGradLight" x1="60" y1="115" x2="360" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7f5"/>
    </linearGradient>
    <linearGradient id="accentStrokeLight" x1="80" y1="110" x2="340" y2="310" gradientUnits="userSpaceOnUse">
